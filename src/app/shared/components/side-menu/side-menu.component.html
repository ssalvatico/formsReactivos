<!-- Encabezado -->
<div class="mb-4">
    <h2 class="page-title">Páginas</h2>
    <p class="text-muted mb-0">
        Explorá los diferentes formularios y ejemplos de validaciones.
    </p>
</div>

<div class="row g-4">

    <!-- Reactive -->
    <div class="col-12 col-md-6">

        <div class="card border-0 shadow-sm menu-card h-100">

            <div class="card-body p-4">

                <div class="menu-header mb-3">
                    <div>
                        <h5 class="mb-1">Reactive</h5>
                        <small class="text-muted">Formularios reactivos</small>
                    </div>
                </div>

                <ul class="list-group modern-list">

                    @for (item of reactiveMenu; track $index) {
                        <li
                            class="list-group-item"
                            [routerLink]="[item.route]"
                            routerLinkActive="active"
                            [style.cursor]="selectedItem !== item.title ? 'pointer' : 'unset'"
                            (click)="selectedItem = item.title"
                        >
                            <span>{{ item.title }}</span>
                            <i class="bi bi-chevron-right"></i>
                        </li>
                    }

                </ul>

            </div>

        </div>

    </div>

    <!-- Validaciones -->
    <div class="col-12 col-md-6">

        <div class="card border-0 shadow-sm menu-card h-100">

            <div class="card-body p-4">

                <div class="menu-header mb-3">
                    <div>
                        <h5 class="mb-1">Validaciones</h5>
                        <small class="text-muted">Reglas y controles</small>
                    </div>

                    <span class="menu-icon">
                        <i class="bi bi-shield-check"></i>
                    </span>
                </div>

                <ul class="list-group modern-list">

                    @for (item of authMenu; track $index) {
                        <li
                            class="list-group-item"
                            [routerLink]="[item.route]"
                            routerLinkActive="active"
                            [style.cursor]="selectedItem !== item.title ? 'pointer' : 'unset'"
                            (click)="selectedItem = item.title"
                        >
                            <span>{{ item.title }}</span>
                            <i class="bi bi-chevron-right"></i>
                        </li>
                    }

                </ul>

            </div>

        </div>

    </div>

</div>
