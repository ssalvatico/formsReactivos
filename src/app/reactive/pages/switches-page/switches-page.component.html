<div class="reactive-container">
    <div class="page-header">
        <h2>Reactivos <small>Switches</small></h2>
        <p>Preferencias de notificaciones y aceptación de términos.</p>
    </div>

    <div class="form-card">

    <form autocomplete="off" [formGroup]="myForm" (ngSubmit)="onSave()">

        <!-- Radio -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Género</label>
            <div class="col-sm-9">

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        value="M"
                        id="radioMasculino"
                        formControlName="gender"
                    >
                        <label class="form-check-label" for="radioMasculino">
                            Masculino
                        </label>
                </div>

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        value="F"
                        id="radioFemenino"
                        formControlName="gender"
                    >
                        <label class="form-check-label" for="radioFemenino">
                            Femenino
                        </label>
                </div>
            </div>
        </div>
    <hr>
        <!-- Switches -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label">Notificaciones</label>
            <div class="col-sm-9">

                <div class="form-field mt-2">
                    <div class="switch theme-accent">
                        <input
                        class="form-check-input"
                        type="checkbox"
                        id="flexSwitchCheckChecked"
                        formControlName="wantNotifications"
                        >
                    </div>
                    <label class="form-check-label" for="flexSwitchCheckChecked">
                        Quiero recibir notificaciones
                    </label>
                </div>
            </div>
        </div>
    <hr>
        <!-- Checkbox -->
        <div class="row mb-3">
            <label class="col-sm-3 col-form-label"></label>
            <div class="col-sm-9">
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="flexCheckDefault"
                        formControlName="termsAndConditions"
                    >
                        <label class="form-check-label" for="flexCheckDefault">
                            Términos y condiciones de uso
                        </label>
                </div>
                @if (isNotValidField('termsAndConditions')) {
                    <span class="form-text invalid-feedback d-block">
                        Debe de aceptar las condiciones de uso
                    </span>
                }
            </div>
        </div>

        <!-- Boton submit -->
        <div class="form-footer">
            <button class="btn-subtle theme-accent btn-save float-end"
                    type="submit">
                Guardar
            </button>
        </div>
    </form>
</div>

<h5>Valor del formulario</h5>
<pre>{{ myForm.value | json }}</pre>
<br>

<h5>Persona</h5>
<pre>{{ person | json }}</pre>
<br>

<h5>Valid</h5>
<pre>{{ myForm.valid | json }}</pre>

<!-- <h5>Términos</h5> -->
<!-- <pre>{{ myForm.controls?.terminos?.errors | json }}</pre> -->

<!-- <br>
<pre>Condiciones: </pre> -->
</div>
