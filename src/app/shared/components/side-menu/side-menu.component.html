<h2>Páginas</h2>
<hr>

<div class="d-flex flex-column gap-7">
    <div>
        <h4 class="mt-3">Reactive</h4>
        <ul class="list-group">
            @for (item of reactiveMenu; track $index) {
                <li 
                    class="list-group-item"
                    [routerLink]="[item.route]"
                    routerLinkActive="active"
                >{{ item.title }}</li>
            }
        </ul>
    </div>
    <div>
        <h4>Validaciones</h4>
        <ul class="list-group">
            @for (item of authMenu; track $index) {
                <li 
                    class="list-group-item"
                    [routerLink]="[item.route]"
                    routerLinkActive="active"
                >{{ item.title }}</li>
            }
        </ul>
    </div>
</div>
